name: Publish

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      is_release_tag: ${{ steps.gate.outputs.is_release_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Determine if this build was for a tag on main
        id: gate
        run: |
          tag=$(git tag --points-at HEAD)
          if [ -n "$tag" ] && git merge-base --is-ancestor HEAD origin/main; then
            echo "is_release_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release_tag=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: needs.check.outputs.is_release_tag == 'true'
    runs-on: ubuntu-latest
    environment: publish
    container:
      image: node:lts-trixie-slim
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Enable corepack
        run: corepack enable

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            dist
            docs
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Publish to npm
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
